name: Android build

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "ndk;29.0.14206865"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/29.0.14206865\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-fold-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
