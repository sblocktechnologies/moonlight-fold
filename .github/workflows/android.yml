name: Android build

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform and NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --channel=3 "platforms;android-37" "ndk;29.0.14206865"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/29.0.14206865\n' "$sdk_root" "$sdk_root" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-fold-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
